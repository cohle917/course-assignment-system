server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: public
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/course/**
          filters:
            - StripPrefix=1
        - id: homework-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/homework/**
          filters:
            - StripPrefix=1
